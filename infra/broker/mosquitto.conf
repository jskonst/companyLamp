# Mosquitto 2.x для группы ламп companyLamp.
# Анонимный доступ выключен: нужны логин и пароль (см. add-user.sh).

per_listener_settings false

persistence true
persistence_location /mosquitto/data
autosave_interval 60

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Основной слушатель. Пароли здесь идут открытым текстом — см. README.
listener 1883
protocol mqtt

# TLS 8883 подключается через include_dir, если install.sh получил DOMAIN
# и положил conf.d/tls.conf (см. conf.d/tls.conf.example).
include_dir /mosquitto/config/conf.d

# Ограничения под небольшую группу ламп (15–20 клиентов, ESP8266).
# В прошивке keepalive 15 с, client id lamp-<id>, QoS 1 на status/state.
max_connections 100
max_packet_size 2048
max_inflight_messages 10
max_queued_messages 100
# 0 = не переопределять keepalive клиента (прошивка использует 15 с).
max_keepalive 0
