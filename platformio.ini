; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default
build_type = debug
board_build.filesystem = littlefs
; Пароль OTA. Пустая строка не соберётся (static_assert в прошивке).
; Если меняете пароль — поменяйте и upload_flags в env:d1_mini_ota.
build_flags =
    -D LAMP_OTA_PASS=\"companylamp\"
lib_deps = 
    GyverLibs/Settings
    GyverLibs/WiFiConnector
	makuna/NeoPixelBus@^2.8.0
	gyverlibs/EncButton@^3.7.4
	knolleary/PubSubClient@^2.8

; Прошивка по Wi-Fi, когда micro-USB уже закрыт корпусом.
; Пароль --auth совпадает с LAMP_OTA_PASS.
; У каждой лампы своё имя companyLamp-<chipid>.local; порт ниже — общий пример.
; Для конкретной лампы: pio run -e d1_mini_ota -t upload --upload-port companyLamp-a1b2c3.local
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = companylamp.local
upload_flags =
    --auth=companylamp
