; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default
build_type = release
board_build.filesystem = littlefs
; Пароль OTA. Пустая строка запрещена (см. static_assert в прошивке).
; Если меняете пароль — поменяйте и upload_flags в env:d1_mini_ota.
build_flags =
    -D LAMP_OTA_PASS=\"companylamp\"
    -D MQTT_DNS_TIMEOUT_MS=500
test_ignore = *
lib_deps =
    GyverLibs/Settings
    GyverLibs/WiFiConnector
    gyverlibs/GyverPortal@^3.6.6
    fastled/FastLED@^3.10.3
    gyverlibs/EEManager@^2.0.1
    gyverlibs/EncButton@^3.7.4
    marvinroger/AsyncMqttClient@^0.9.0
    ESP32Async/ESPAsyncTCP@2.0.0

; Прошивка по Wi-Fi, micro-USB внутри корпуса недоступен:
;   pio run -e d1_mini_ota -t upload --upload-port 192.168.1.10
; Пароль --auth совпадает с LAMP_OTA_PASS.
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_flags =
    --auth=companylamp

; Юнит-тесты чистой логики (цвет, среднее, JSON, топики). Без прошивки.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Iinclude
